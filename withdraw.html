{% extends 'base.html' %}

{% block content %}
    <h2>Снятие наличных</h2>
    <form method="POST" action="{{ url_for('withdraw') }}">
        <div class="form-group">
            <label for="amount">Сумма (кратно 100):</label>
            <input type="number" id="amount" name="amount" min="100" step="100" required>
        </div>
        <button type="submit" class="btn">Снять</button>
    </form>
    <br>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Назад</a>
{% endblock %}
